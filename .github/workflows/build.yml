name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - '*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME_LOWER: ${{ github.event.repository.name }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y gcc make
      
      - name: Build
        run: |
          chmod +x ci/build.sh
          ./ci/build.sh
      
      - name: Test
        run: |
          chmod +x ci/test.sh
          ./ci/test.sh
      
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: processor-binary
          path: processor

  package:
    name: Create DEB Package
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: processor-binary
          path: .
      
      - name: Make binary executable
        run: chmod +x processor
      
      - name: Create DEB
        run: |
          chmod +x ci/package.sh
          ./ci/package.sh
      
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: processor-deb
          path: processor_1.0.deb

  deploy:
    name: Deploy and Test Docker Container
    runs-on: ubuntu-latest
    needs: package
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download DEB package
        uses: actions/download-artifact@v4
        with:
          name: processor-deb
          path: .
      
      - name: Build Docker image
        run: |
          docker build -t processor:test .
      
      - name: Test Docker container
        run: |
          docker run --rm processor:test "your mama dont likes me she likes every one"
      
      - name: Upload Docker image as artifact
        run: |
          docker save processor:test | gzip > processor-docker.tar.gz
      
      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: processor-docker
          path: processor-docker.tar.gz

  docker-push:
    name: Push Docker Image to GHCR and Docker Hub
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref_type == 'tag'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Download DEB package
        uses: actions/download-artifact@v4
        with:
          name: processor-deb
          path: .
      
      - name: Build Docker image
        run: |
          docker build -t processor:${{ github.ref_name }} .
          docker tag processor:${{ github.ref_name }} processor:latest
      
      # Push to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push to GHCR
        run: |
          docker tag processor:${{ github.ref_name }} ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:latest
          docker tag processor:${{ github.ref_name }} ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ github.ref_name }}
      
      # Push to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Push to Docker Hub
        run: |
          docker tag processor:${{ github.ref_name }} ${{ secrets.DOCKERHUB_USERNAME }}/trrspo:latest
          docker tag processor:${{ github.ref_name }} ${{ secrets.DOCKERHUB_USERNAME }}/trrspo:${{ github.ref_name }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/trrspo:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/trrspo:${{ github.ref_name }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [package, docker-push]
    if: github.ref_type == 'tag'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Download DEB
        uses: actions/download-artifact@v4
        with:
          name: processor-deb
          path: .
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: processor_1.0.deb
          name: Release ${{ github.ref_name }}
          body: |
            Автоматический релиз от GitHub Actions
            
            Программа: замена пробелов на самый частый символ
            Вариант: 21
            
            Docker images:
            - `ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}`
            - `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/trrspo:${{ github.ref_name }}`
          draft: false
          prerelease: false
          generate_release_notes: true
